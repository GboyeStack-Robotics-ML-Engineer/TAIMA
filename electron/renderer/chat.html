<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAIMA</title>
    <link rel="stylesheet" href="chat.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container" id="chatContainer">
        <!-- Header Section with Drag Handle -->
        <div class="chat-header">
            <div class="window-controls">
                <button class="traffic-btn close" id="closeBtn" title="Close">
                    <span class="traffic-glyph">×</span>
                </button>
                <button class="traffic-btn minimize" id="minimizeBtn" title="Minimize">
                    <span class="traffic-glyph">−</span>
                </button>
                <button class="traffic-btn maximize" id="maximizeBtn" title="Maximize">
                    <span class="traffic-glyph">+</span>
                </button>
            </div>
            <div class="header-title">
                <span class="title-icon">🌌</span>
                <span>TAIMA</span>
            </div>
            <div class="header-actions">
                <button class="control-btn google-connect" id="googleConnectBtn" title="Connect Google Account">
                    <span class="control-icon google-icon" aria-hidden="true">
                        <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" focusable="false">
                            <path d="M19.6 10.23c0-.68-.06-1.33-.18-1.96H10v3.71h5.38a4.6 4.6 0 0 1-2 3.03v2.5h3.24c1.9-1.75 2.98-4.33 2.98-7.28Z" fill="#4285F4"/>
                            <path d="M10 20c2.7 0 4.96-.9 6.61-2.44l-3.24-2.5c-.9.6-2.05.95-3.37.95-2.6 0-4.81-1.75-5.59-4.13H1.07v2.6A10 10 0 0 0 10 20Z" fill="#34A853"/>
                            <path d="M4.41 11.88c-.2-.6-.31-1.25-.31-1.88s.11-1.29.31-1.88V5.52H1.07A10 10 0 0 0 0 10c0 1.6.38 3.12 1.07 4.48l3.34-2.6Z" fill="#FBBC05"/>
                            <path d="M10 3.96c1.47 0 2.78.5 3.81 1.48l2.86-2.86C14.96 1.02 12.7 0 10 0 6.09 0 2.69 2.23 1.07 5.52l3.34 2.6C4.98 5.75 7.19 3.96 10 3.96Z" fill="#EA4335"/>
                        </svg>
                    </span>
                    <span class="control-label">Connect Google</span>
                </button>
                <button class="control-btn screen-select" id="screenSelectBtn" title="Select Screen Area">
                    <span class="control-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false">
                            <path d="M6.5 10a3.5 3.5 0 0 0-3.28 2.29c-.1.3-.22.61-.22.93 0 1.16.94 2.1 2.1 2.1h1.07a3.33 3.33 0 0 0 3.11-2.2l.45-1.21c.2-.51.75-.8 1.29-.66.34.09.62.34.75.67l.48 1.21a3.34 3.34 0 0 0 3.11 2.19h1.07c1.16 0 2.1-.94 2.1-2.1 0-.32-.11-.63-.22-.93A3.5 3.5 0 0 0 17.5 10c-1.33 0-2.5.73-3.08 1.81-.29.53-.88.8-1.47.65-.35-.09-.64-.34-.78-.67l-.36-.91c-.26-.65-.89-1.07-1.59-1.07-.7 0-1.33.42-1.6 1.07l-.35.91c-.14.33-.43.58-.78.67a1.35 1.35 0 0 1-1.47-.65A3.37 3.37 0 0 0 6.5 10Z" fill="currentColor"/>
                            <path d="M6.5 8c-2.48 0-4.5 2.02-4.5 4.5 0 .22.02.44.05.66C2.3 15.3 3.95 17 6.16 17h1.07c1.5 0 2.86-.93 3.39-2.32l.45-1.2c.04-.1.14-.16.24-.16s.2.06.24.16l.48 1.21A3.63 3.63 0 0 0 15.77 17h1.07c2.21 0 3.86-1.7 4.11-3.84.03-.22.05-.44.05-.66C21 10.02 18.98 8 16.5 8c-1.52 0-2.9.75-3.74 1.94-.46.66-1.45.66-1.9 0A4.59 4.59 0 0 0 6.5 8Z" fill="currentColor"/>
                        </svg>
                    </span>
                    <span class="visually-hidden">Select Screen Area</span>
                </button>
            </div>
        </div>

        <!-- Dynamic Content Area -->
        <div class="content-area" id="contentArea">
            <!-- Text Mode Content -->
            <div class="text-mode-content" id="textModeContent">
                <!-- Animated Waveform Visualizer -->
                <div class="waveform-container">
                    <div class="wave-layer layer-1">
                        <div class="wave wave-1"></div>
                    </div>
                    <div class="wave-layer layer-2">
                        <div class="wave wave-2"></div>
                    </div>
                    <div class="wave-layer layer-3">
                        <div class="wave wave-3"></div>
                    </div>
                    <div class="wave-layer layer-4">
                        <div class="wave wave-4"></div>
                    </div>
                </div>
                
                <!-- Messages Area -->
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be dynamically added here -->
                </div>
            </div>

            <!-- Audio Mode Content -->
            <div class="audio-mode-content hidden" id="audioModeContent">
                <!-- Live Audio Waveform -->
                <div class="live-waveform-container" id="liveWaveformContainer">
                    <canvas id="audioWaveform" class="audio-waveform"></canvas>
                    <div class="waveform-overlay">
                        <button id="backToTextBtn" class="back-to-text-btn" title="Back to Text Mode" >
                            <span class="back-icon">←</span>
                        </button>
                        <div class="visualizer-stage" aria-hidden="true">
                            <div class="visualizer-core"></div>
                            <div class="visualizer-wave visualizer-wave-back"></div>
                            <div class="visualizer-wave visualizer-wave-mid"></div>
                            <div class="visualizer-wave visualizer-wave-front"></div>
                            <div class="visualizer-glow"></div>
                        </div>
                        <div class="status-stack">
                            <div class="status-indicator listening" id="listeningIndicator">
                                <div class="pulse-dot"></div>
                                <span>Listening...</span>
                            </div>
                            <div class="status-indicator processing hidden" id="processingIndicator">
                                <div class="pulse-dot"></div>
                                <span>Processing...</span>
                            </div>
                            <div class="status-indicator speaking hidden" id="speakingIndicator">
                                <div class="pulse-dot"></div>
                                <span>Speaking...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Audio Status -->
                <div class="audio-status">
                    <div class="status-message" id="statusMessage">
                        Voice mode active - Start speaking naturally
                    </div>
                    <div class="sensitivity-control">
                        <label for="sensitivitySlider">Voice Sensitivity</label>
                        <input type="range" id="sensitivitySlider" min="0.1" max="1.0" step="0.1" value="0.5">
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Section -->
        <div class="chat-input-container" id="textInputContainer">
            <div class="suggestion-bar hidden" id="suggestionBar">
                <div class="suggestion-header">
                    <div class="suggestion-title-group">
                        <span class="suggestion-title">Suggested next steps</span>
                        <span class="service-status-pill disconnected" id="googleStatusPill">Google disconnected</span>
                    </div>
                    <div class="suggestion-header-actions">
                        <button id="refreshSuggestionsBtn" class="suggestion-refresh-btn" title="Refresh suggestions">
                            ↻
                        </button>
                        <button id="toggleSuggestionsBtn" class="suggestion-toggle-btn" aria-expanded="true" title="Collapse suggestions">
                            <span class="toggle-icon">▾</span>
                            <span class="visually-hidden">Collapse suggestions</span>
                        </button>
                    </div>
                </div>
                <div class="suggestion-chips" id="suggestionChips"></div>
            </div>
            <div class="input-bar">
                <button id="quickActionBtn" class="input-icon-btn" title="Quick Actions">
                    <span class="icon">+</span>
                </button>
                <textarea 
                    id="messageInput" 
                    placeholder="Write your prompt here.."
                    rows="1"
                ></textarea>
                <button id="sendBtn" class="send-btn" title="Send Message">
                    <span class="send-icon">↑</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Screen Selection Overlay -->
    <div id="screenSelectionOverlay" class="screen-selection-overlay hidden">
        <div class="selection-guide">
            <h3>🎯 Select Focus Area</h3>
            <p>Choose how you want to capture content for AI analysis</p>
            <div class="selection-options">
                <button type="button" class="selection-option active" data-type="entire-screen">
                    <span class="option-icon" aria-hidden="true">
                        <svg class="icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false">
                            <rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
                            <path d="M8 20h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
                            <path d="M12 16v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
                        </svg>
                    </span>
                    <div class="option-details">
                        <span class="option-title">Entire Screen</span>
                        <span class="option-desc">Capture everything on your display</span>
                    </div>
                </button>
                <button type="button" class="selection-option" data-type="active-window">
                    <span class="option-icon" aria-hidden="true">
                        <svg class="icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false">
                            <rect x="4" y="5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
                            <rect x="7" y="8" width="10" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
                        </svg>
                    </span>
                    <div class="option-details">
                        <span class="option-title">Active Window</span>
                        <span class="option-desc">Lock onto the app you are working in</span>
                    </div>
                </button>
                <button type="button" class="selection-option" data-type="custom-area">
                    <span class="option-icon" aria-hidden="true">
                        <svg class="icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false">
                            <rect x="5" y="5" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="4 3"></rect>
                            <path d="M10 14l3.5 3.5L18 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </span>
                    <div class="option-details">
                        <span class="option-title">Custom Area</span>
                        <span class="option-desc">Drag a frame around the important region</span>
                    </div>
                </button>
            </div>
            <div class="selection-actions">
                <button class="btn-secondary" id="cancelSelection">Cancel</button>
                <button class="btn-primary" id="confirmSelection">Confirm</button>
            </div>
        </div>
    </div>

    <script src="chat.js"></script>
</body>
</html>
