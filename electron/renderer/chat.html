<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAIMA</title>
    <link rel="stylesheet" href="chat.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container" id="chatContainer">
        <!-- Header Section with Drag Handle -->
        <div class="chat-header">
            <div class="window-controls">
                <button class="traffic-btn close" id="closeBtn" title="Close">
                    <span class="traffic-glyph">×</span>
                </button>
                <button class="traffic-btn minimize" id="minimizeBtn" title="Minimize">
                    <span class="traffic-glyph">−</span>
                </button>
                <button class="traffic-btn maximize" id="maximizeBtn" title="Maximize">
                    <span class="traffic-glyph">+</span>
                </button>
            </div>
            <div class="header-title">
                <span class="title-icon">🌌</span>
                <span>TAIMA</span>
            </div>
            <div class="header-actions">
                <button class="control-btn screen-select" id="screenSelectBtn" title="Select Screen Area">􀏅</button>
            </div>
        </div>

        <!-- Dynamic Content Area -->
        <div class="content-area" id="contentArea">
            <!-- Text Mode Content -->
            <div class="text-mode-content" id="textModeContent">
                <!-- Animated Waveform Visualizer -->
                <div class="waveform-container">
                    <div class="wave-layer layer-1">
                        <div class="wave wave-1"></div>
                    </div>
                    <div class="wave-layer layer-2">
                        <div class="wave wave-2"></div>
                    </div>
                    <div class="wave-layer layer-3">
                        <div class="wave wave-3"></div>
                    </div>
                    <div class="wave-layer layer-4">
                        <div class="wave wave-4"></div>
                    </div>
                </div>
                
                <!-- Messages Area -->
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be dynamically added here -->
                </div>
            </div>

            <!-- Audio Mode Content -->
            <div class="audio-mode-content hidden" id="audioModeContent">
                <!-- Live Audio Waveform -->
                <div class="live-waveform-container" id="liveWaveformContainer">
                    <canvas id="audioWaveform" class="audio-waveform"></canvas>
                    <div class="waveform-overlay">
                        <button id="backToTextBtn" class="back-to-text-btn" title="Back to Text Mode" >
                            <span class="back-icon">←</span>
                        </button>
                        <div class="visualizer-stage" aria-hidden="true">
                            <div class="visualizer-core"></div>
                            <div class="visualizer-wave visualizer-wave-back"></div>
                            <div class="visualizer-wave visualizer-wave-mid"></div>
                            <div class="visualizer-wave visualizer-wave-front"></div>
                            <div class="visualizer-glow"></div>
                        </div>
                        <div class="status-stack">
                            <div class="status-indicator listening" id="listeningIndicator">
                                <div class="pulse-dot"></div>
                                <span>Listening...</span>
                            </div>
                            <div class="status-indicator processing hidden" id="processingIndicator">
                                <div class="pulse-dot"></div>
                                <span>Processing...</span>
                            </div>
                            <div class="status-indicator speaking hidden" id="speakingIndicator">
                                <div class="pulse-dot"></div>
                                <span>Speaking...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Audio Status -->
                <div class="audio-status">
                    <div class="status-message" id="statusMessage">
                        Voice mode active - Start speaking naturally
                    </div>
                    <div class="sensitivity-control">
                        <label for="sensitivitySlider">Voice Sensitivity</label>
                        <input type="range" id="sensitivitySlider" min="0.1" max="1.0" step="0.1" value="0.5">
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Section -->
        <div class="chat-input-container" id="textInputContainer">
            <div class="input-bar">
                <button id="quickActionBtn" class="input-icon-btn" title="Quick Actions">
                    <span class="icon">+</span>
                </button>
                <textarea 
                    id="messageInput" 
                    placeholder="Write your prompt here.."
                    rows="1"
                ></textarea>
                <button id="sendBtn" class="send-btn" title="Send Message">
                    <span class="send-icon">↑</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Screen Selection Overlay -->
    <div id="screenSelectionOverlay" class="screen-selection-overlay hidden">
        <div class="selection-guide">
            <h3>🎯 Select Focus Area</h3>
            <p>Choose how you want to capture content for AI analysis</p>
            <div class="selection-options">
                <button type="button" class="selection-option active" data-type="entire-screen">
                    <span class="option-icon" aria-hidden="true">
                        <svg class="icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false">
                            <rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
                            <path d="M8 20h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
                            <path d="M12 16v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
                        </svg>
                    </span>
                    <div class="option-details">
                        <span class="option-title">Entire Screen</span>
                        <span class="option-desc">Capture everything on your display</span>
                    </div>
                </button>
                <button type="button" class="selection-option" data-type="active-window">
                    <span class="option-icon" aria-hidden="true">
                        <svg class="icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false">
                            <rect x="4" y="5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
                            <rect x="7" y="8" width="10" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
                        </svg>
                    </span>
                    <div class="option-details">
                        <span class="option-title">Active Window</span>
                        <span class="option-desc">Lock onto the app you are working in</span>
                    </div>
                </button>
                <button type="button" class="selection-option" data-type="custom-area">
                    <span class="option-icon" aria-hidden="true">
                        <svg class="icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false">
                            <rect x="5" y="5" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="4 3"></rect>
                            <path d="M10 14l3.5 3.5L18 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </span>
                    <div class="option-details">
                        <span class="option-title">Custom Area</span>
                        <span class="option-desc">Drag a frame around the important region</span>
                    </div>
                </button>
            </div>
            <div class="selection-actions">
                <button class="btn-secondary" id="cancelSelection">Cancel</button>
                <button class="btn-primary" id="confirmSelection">Confirm</button>
            </div>
        </div>
    </div>

    <script src="chat.js"></script>
</body>
</html>
