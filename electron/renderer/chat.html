<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAIMA</title>
    <link rel="stylesheet" href="chat.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container" id="chatContainer" role="application" aria-label="TAIMA chat application">
        <!-- Header Section with Drag Handle -->
    <div class="chat-header">
            <div class="drag-handle"></div>
            <div class="header-title">
                <span class="title-icon">🌌</span>
                <span>TAIMA</span>
            </div>
            <div class="window-controls">
                <button class="control-btn screen-select" id="screenSelectBtn" title="Select Screen Area">􀏅</button>
                <button class="control-btn minimize" title="Minimize">−</button>
                <button class="control-btn maximize" id="maximizeBtn" title="Maximize">□</button>
                <button class="control-btn close" id="closeBtn" title="Close">×</button>
            </div>
        </div>

        <!-- Dynamic Content Area -->
    <div class="content-area" id="contentArea" role="region" aria-label="Conversation area">
            <!-- Text Mode Content -->
            <div class="text-mode-content" id="textModeContent">
                <!-- Animated Waveform Visualizer -->
                <div class="waveform-container">
                    <div class="wave-layer layer-1">
                        <div class="wave wave-1"></div>
                    </div>
                    <div class="wave-layer layer-2">
                        <div class="wave wave-2"></div>
                    </div>
                    <div class="wave-layer layer-3">
                        <div class="wave wave-3"></div>
                    </div>
                    <div class="wave-layer layer-4">
                        <div class="wave wave-4"></div>
                    </div>
                </div>
                
                <!-- Messages Area -->
                <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-relevant="additions">
                    <!-- Messages will be dynamically added here -->
                </div>
            </div>

            <!-- Audio Mode Content -->
            <div class="audio-mode-content hidden" id="audioModeContent">
                <!-- Live Audio Waveform -->
                <div class="live-waveform-container" id="liveWaveformContainer">
                    <canvas id="audioWaveform" class="audio-waveform"></canvas>
                    <div class="waveform-overlay">
                        <button id="backToTextBtn" class="back-to-text-btn" title="Back to Text Mode" >
                            <span class="back-icon">←</span>
                        </button>
                        <div class="status-indicator listening" id="listeningIndicator">
                            <div class="pulse-dot"></div>
                            <span>Listening...</span>
                        </div>
                        <div class="status-indicator processing hidden" id="processingIndicator">
                            <div class="pulse-dot"></div>
                            <span>Processing...</span>
                        </div>
                        <div class="status-indicator speaking hidden" id="speakingIndicator">
                            <div class="pulse-dot"></div>
                            <span>Speaking...</span>
                        </div>
                    </div>
                </div>

                <!-- Audio Status -->
                <div class="audio-status">
                    <div class="status-message" id="statusMessage">
                        Voice mode active - Start speaking naturally
                    </div>
                    <div class="sensitivity-control">
                        <label for="sensitivitySlider">Voice Sensitivity</label>
                        <input type="range" id="sensitivitySlider" min="0.1" max="1.0" step="0.1" value="0.5">
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Section -->
        <div class="chat-input-container" id="textInputContainer">
            <div class="input-bar">
                <textarea 
                    id="messageInput" 
                    placeholder="Write your prompt here.."
                    rows="1"
                    aria-label="Message input"
                    aria-multiline="true"
                ></textarea>
                <button id="sendBtn" class="send-btn" title="Send Message">
                    <span class="send-icon">↑</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Screen Selection Overlay -->
    <div id="screenSelectionOverlay" class="screen-selection-overlay hidden">
        <div class="selection-guide">
            <h3>🎯 Select Focus Area</h3>
            <p>Choose how you want to capture content for AI analysis</p>
            <div class="selection-options">
                <button class="selection-option active" data-type="entire-screen">
                    <span class="option-icon">􀉭</span>
                    <span>Entire Screen</span>
                </button>
                <button class="selection-option" data-type="active-window">
                    <span class="option-icon">􀤙</span>
                    <span>Active Window</span>
                </button>
                <button class="selection-option" data-type="custom-area">
                    <span class="option-icon">􀡅</span>
                    <span>Custom Area</span>
                </button>
            </div>
            <div class="selection-actions">
                <button class="btn-secondary" id="cancelSelection">Cancel</button>
                <button class="btn-primary" id="confirmSelection">Confirm</button>
            </div>
        </div>
    </div>

    <script src="chat.js"></script>
</body>
</html>
