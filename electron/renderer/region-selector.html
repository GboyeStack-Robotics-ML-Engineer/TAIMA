<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Region Selector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.3);
            cursor: crosshair;
            overflow: hidden;
        }

        .selection-box {
            position: absolute;
            border: 2px solid #667eea;
            background: rgba(102, 126, 234, 0.1);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
            pointer-events: none;
        }

        .selection-box::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border: 2px dashed rgba(102, 126, 234, 0.6);
            animation: dash 1s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -20;
            }
        }

        .info-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(102, 126, 234, 0.5);
        }
    </style>
</head>
<body>
    <div class="info-overlay">
        Click and drag to select region • Press ESC to cancel
    </div>
    <div id="selectionBox" class="selection-box" style="display: none;"></div>

    <script>
        const { ipcRenderer } = require('electron');
        let isSelecting = false;
        let startX = 0;
        let startY = 0;
        let selectionBox = document.getElementById('selectionBox');
        
        // Listen for ESC key to cancel
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                ipcRenderer.invoke('cancel-region-selection');
            }
        });

        // Start selection on mouse down
        document.addEventListener('mousedown', (e) => {
            isSelecting = true;
            startX = e.clientX;
            startY = e.clientY;
            selectionBox.style.display = 'block';
            selectionBox.style.left = startX + 'px';
            selectionBox.style.top = startY + 'px';
            selectionBox.style.width = '0px';
            selectionBox.style.height = '0px';
        });

        // Update selection on mouse move
        document.addEventListener('mousemove', (e) => {
            if (!isSelecting) return;

            const currentX = e.clientX;
            const currentY = e.clientY;

            const left = Math.min(startX, currentX);
            const top = Math.min(startY, currentY);
            const width = Math.abs(currentX - startX);
            const height = Math.abs(currentY - startY);

            selectionBox.style.left = left + 'px';
            selectionBox.style.top = top + 'px';
            selectionBox.style.width = width + 'px';
            selectionBox.style.height = height + 'px';
        });

        // End selection on mouse up
        document.addEventListener('mouseup', (e) => {
            if (!isSelecting) return;

            isSelecting = false;
            const endX = e.clientX;
            const endY = e.clientY;

            const left = Math.min(startX, endX);
            const top = Math.min(startY, endY);
            const width = Math.abs(endX - startX);
            const height = Math.abs(endY - startY);

            // Only capture if selection is large enough
            if (width > 10 && height > 10) {
                // Send region to main process
                ipcRenderer.send('select-region', {
                    x: left,
                    y: top,
                    width: width,
                    height: height
                });
            } else {
                selectionBox.style.display = 'none';
            }
        });

    </script>
</body>
</html>
